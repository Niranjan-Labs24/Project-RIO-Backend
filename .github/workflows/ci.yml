name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # `test` keeps the app out of the strict prod fail-closed mode and enables
      # the non-prod x-org-id/x-role dev seam that roles.e2e.spec.ts relies on.
      NODE_ENV: test
      # Owner role (Prisma CLI: migrate/generate/seed) and restricted app role,
      # provisioned below by the same db/init/00-init.sql script the local
      # docker-compose db service runs automatically via
      # docker-entrypoint-initdb.d. The postgres:18 service container above
      # has no equivalent auto-init hook, so we run it explicitly as a step.
      DATABASE_URL: postgresql://cnap_owner:cnap_owner_dev_pw@localhost:5432/cnap
      APP_DATABASE_URL: postgresql://cnap_app:cnap_app_dev_pw@localhost:5432/cnap
      # Cross-org read-only role — created by the rls_domain migration
      # (CREATE ROLE cnap_supervisor ...), so it exists after `migrate deploy`.
      SUPERVISOR_DATABASE_URL: postgresql://cnap_supervisor:cnap_supervisor_dev_pw@localhost:5432/cnap
      # Test-only signing secret (env schema requires >= 32 chars).
      JWT_SECRET: ci_test_jwt_secret_at_least_32_chars_long
    steps:
      - uses: actions/checkout@v4
      # No `version:` here — pnpm/action-setup@v4 reads it from package.json's
      # `packageManager` field (pnpm@10.22.0). Specifying both errors with
      # ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - name: Assert Node major version is 24
        run: |
          node -e "if (process.versions.node.split('.')[0] !== '24') { console.error('Expected Node 24, got ' + process.version); process.exit(1); }"
      - run: pnpm install --frozen-lockfile
      - name: Provision roles and database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -f db/init/00-init.sql
      - run: pnpm prisma migrate deploy
      - run: pnpm prisma generate
      # Seed roles + demo org/admins so the login-based e2e specs (auth, users,
      # organizations, audit) have data to authenticate against.
      - run: pnpm prisma:seed
      # import:methodology --publish creates the real, PUBLISHED v5.0
      # MethodologyVersion — import:domain-priority-config and seed:scored
      # both require one to exist and error out otherwise ("No PUBLISHED
      # methodology version found"). Neither import:questions nor
      # import:scoring-lookups (below) actually creates a PUBLISHED
      # version themselves: import:questions only creates a RETIRED
      # fallback row for its own legacy v1.0 import, and
      # import:scoring-lookups doesn't touch MethodologyVersion at all —
      # this step was previously missing from CI entirely (present only in
      # the local `setup:local` script), which is why this job could reach
      # import:domain-priority-config and still fail there.
      - run: pnpm import:methodology -- --publish
      # Order matters: import:scoring-lookups looks up each CSV row's
      # Question by questionId *before* it creates its own (legacy, v1.0)
      # MethodologyVersion row, so questions must be imported first —
      # otherwise every lookup row is skipped (Question not found).
      # geography is independent but still needed — auth-signup.e2e.spec.ts
      # reads real /api/regions data.
      #
      # nic-registry likewise: signup rejects any registration number that
      # isn't a NIC number in that table, so without this every signup spec
      # fails at the gate (and takeUnusedNicNumber has nothing to claim).
      - run: pnpm import:questions
      - run: pnpm import:scoring-lookups
      - run: pnpm import:domain-priority-config
      - run: pnpm import:geography
      - run: pnpm import:nic-registry
      - run: pnpm grant:access
      - run: pnpm seed:scored
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high
