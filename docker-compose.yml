services:
  redis:
    # Pinned to a reviewed digest (Task 9, container hardening) rather than
    # the floating `redis:7-alpine` tag. Re-pin deliberately (docker pull
    # redis:7-alpine && docker inspect ...) for a genuine upgrade — never
    # widen this back to a bare tag.
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: redis-server --appendonly yes
    volumes:
      - cnap-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    # Built from db/Dockerfile (postgres:18 + a baked self-signed TLS cert) so
    # the database can serve connections over TLS (RIO-NFR-001). ssl is enabled
    # via `command:` below; clients opt in with DB_SSL=true. Non-TLS clients
    # still connect (ssl=on accepts both), so DB_SSL defaults to false.
    build:
      context: .
      dockerfile: db/Dockerfile
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
    container_name: cnap-db
    environment:
      POSTGRES_USER: postgres
      # No hardcoded default — interpolated from your .env (docker compose
      # auto-loads it), same mechanism JWT_SECRET below already used. Local
      # development's value lives in .env.example; a real deployment sets
      # its own via whatever secret-injection mechanism it uses. See
      # README's "Local development vs. production Compose" section —
      # including why the cnap_owner/cnap_app/cnap_supervisor role
      # passwords created by db/init/ and the RLS migration are a separate
      # rotation step, not one of the env vars here.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see README}
      POSTGRES_DB: postgres
      # postgres:18 images store versioned data in a PG_MAJOR-named subdirectory by
      # default (PGDATA=/var/lib/postgresql/18/docker) and refuse to start if a volume
      # is mounted directly at /var/lib/postgresql/data without one. Point PGDATA at a
      # subdirectory of our mount so the existing /data mount path keeps working.
      PGDATA: /var/lib/postgresql/data/pgdata
    # No host port publish here — a production database should not be
    # reachable from outside the compose network at all. Local development
    # re-adds it via docker-compose.dev.yml ("pnpm db:up" applies both files).
    volumes:
      - cnap-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: cnap-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      # Deliberately separate from the app's own APP_DATABASE_URL/
      # SUPERVISOR_DATABASE_URL host-side env vars (which point at
      # localhost:<DB_HOST_PORT> for `pnpm dev` running outside Docker) —
      # this containerized service reaches the db by its compose service
      # name instead, so it needs its own value. No hardcoded default: a
      # predictable connection string baked directly into a
      # production-labeled container is exactly the finding this fixes.
      # DATABASE_URL (cnap_owner) here is NOT for migrations — the api
      # container still never runs those (see below) — it's read only by
      # BackupService (src/modules/backup) for its pg_dump connection, which
      # must bypass RLS to produce a complete backup; APP_DATABASE_URL/
      # SUPERVISOR_DATABASE_URL are both NOBYPASSRLS and would silently
      # back up an incomplete/empty database instead. See env.schema.ts's
      # comment on DATABASE_URL for why this is a deliberate exception.
      DATABASE_URL: ${DOCKER_DATABASE_URL:?DOCKER_DATABASE_URL must be set — see README}
      APP_DATABASE_URL: ${DOCKER_APP_DATABASE_URL:?DOCKER_APP_DATABASE_URL must be set — see README}
      SUPERVISOR_DATABASE_URL: ${DOCKER_SUPERVISOR_DATABASE_URL:?DOCKER_SUPERVISOR_DATABASE_URL must be set — see README}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: loopback
      LOG_LEVEL: info
      # See .env.example — weekly by default; override per-environment via
      # BACKUP_CRON_SCHEDULE if a faster interval is needed while verifying
      # a new environment's backup works.
      BACKUP_DIR: /app/storage/backups
      BACKUP_CRON_SCHEDULE: "${BACKUP_CRON_SCHEDULE:-0 3 * * 0}"
    # A named volume, not just a container-local directory: the whole point
    # of a backup is to survive the container being recreated (redeployed,
    # crashed and restarted, ...) — an ephemeral path here would silently
    # lose every dump the moment the container is replaced.
    volumes:
      - cnap-backups:/app/storage/backups
    # Migrations are NOT run automatically here: `prisma` (the CLI) and
    # prisma.config.ts are dev-only tooling and this runtime image is built
    # with `pnpm install --prod`, so the CLI isn't present. Apply schema
    # changes from the host (or a one-off `build` target container) with
    # `pnpm prisma migrate deploy` before/while this service starts — see
    # README.md "Quick start" and "Migrations in Docker".
    ports:
      # Host port defaults to 4000 (the FE default NEXT_PUBLIC_API_BASE_URL is
      # http://localhost:4000/api). Override with API_HOST_PORT in your local
      # .env if 4000 is already taken on your machine.
      - '${API_HOST_PORT:-4000}:4000'
    healthcheck:
      # Liveness, not readiness — this only confirms the process is up and
      # accepting connections. curl/wget aren't installed on node:24-slim, so
      # the check shells out to Node's own http client instead of adding a
      # package just for this.
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:4000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  cnap-db-data:
  cnap-redis-data:
  cnap-backups:
