onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - esbuild
  - '@swc/core'
  - argon2

# find-my-way/valibot are transitive dependencies of @prisma/dev, Prisma's
# own dev-server tooling (never reachable at runtime by this app) — pulled
# in only because @prisma/client depends on prisma at build/dev time.
# uuid/brace-expansion are bundled by exceljs's own archiver dependency
# chain, which hasn't published a release picking up either patched
# version. All are forced here since none is independently upgradable
# through our own package.json ranges.
#
# brace-expansion is scoped to exceljs's own two archiver>...>minimatch
# paths specifically (not a bare "brace-expansion" override) — 5.x changed
# its export shape in a way older minimatch versions elsewhere in the tree
# (e.g. ESLint's own minimatch@3.1.5) don't expect, so a global override
# breaks anything still on the old API; forcing it only inside exceljs's
# own chain avoids that collision entirely.
overrides:
  'deepmerge-ts': '>=8.0.0'
  'fast-uri': '>=3.1.6'
  'minimatch@10.2.5>brace-expansion': '>=5.0.9'
  'mysql2': '>=3.24.0'
  # Upper bound matters as much as the lower one. The advisory is fixed in
  # 0.8.15, but a bare '>=0.8.15' resolves to 0.9.x, where
  # DOMParser.parseFromString made the mimeType argument mandatory.
  # mammoth (the only consumer here) still calls it with one argument, so
  # every .docx upload failed with 'the provided mimeType "undefined" is
  # not valid' — the Document-based AI Summary simply could not read Word
  # files. Same trap as the brace-expansion note above: a too-broad
  # override silently breaks a consumer built against the older API.
  '@xmldom/xmldom': '>=0.8.15 <0.9.0'
  'multer': '>=2.3.0'
  # twilio's own range (^1.13.5) already admits the patched axios; the lock
  # was just pinned below it. Scoped and capped at 2.x so no other consumer
  # is moved and a future axios major can't slip in under twilio.
  'twilio>axios': '>=1.20.0 <2.0.0'
  # axios (via twilio) still pins follow-redirects 1.16.0, which leaks
  # credential headers on cross-origin redirects (GHSA-q3jh-wrc6-jgq8,
  # GHSA-8r9p-f939-6h3c). Fixed in 1.16.1; scoped to axios's own edge and
  # capped at 1.x, as above.
  'axios>follow-redirects': '>=1.16.1 <2.0.0'
  'qs': '>=6.16.0'
  find-my-way: '>=9.7.0'
  valibot: '>=1.4.2'
  uuid@<11.1.1: '>=11.1.1'
  # Scoped to glob's own dependency edge (not a bare "minimatch" or
  # "brace-expansion" override) specifically so ESLint's own direct,
  # unrelated `minimatch@^3.1.5` dependency is left untouched — a global
  # brace-expansion override broke it (old minimatch calling brace-
  # expansion 5.x's changed export shape). glob>minimatch pulls in a
  # self-consistent, already-patched minimatch+brace-expansion pair instead
  # of mismatching an old minimatch against a new brace-expansion.
  #
  # minimatch below 11.0.1 has a ReDoS via globparts amplification
  # (GHSA-g3hv-75wg-m249). glob 7 cannot take minimatch 11: every wildcard
  # pattern throws "Cannot read properties of undefined (reading 'charAt')".
  # So the two production users of glob 7, both inside exceljs, are moved
  # off it instead:
  # - archiver-utils moves to glob 14. 14.0.2+ also fixes glob's own
  #   AbortSignal advisory (GHSA-3g3m-2fjr-6pw4). glob 14 depends on
  #   minimatch 11 and still has glob.sync(pattern, options), the only call
  #   archiver-utils makes.
  # - rimraf 2 (exceljs > unzipper > fstream > rimraf) moves to glob 14 too.
  #   rimraf only calls glob for a path that contains wildcards AND does not
  #   exist. fstream is only used by unzipper's Extract(), which neither
  #   exceljs nor this app calls. Moving unzipper to 0.12 (which drops
  #   fstream) would also clear it, but means running exceljs on an unzipper
  #   major outside its own ^0.10.11 range; this override touches less.
  archiver-utils>glob: '>=14.0.2 <15.0.0'
  rimraf@2>glob: '>=14.0.2 <15.0.0'
  # readdir-glob (also part of exceljs's archiver chain) depends on
  # minimatch directly rather than via "glob" — same reasoning as above.
  readdir-glob>minimatch: '>=11.0.1 <12.0.0'
  # express (via @nestjs/platform-express) and magicast (via prisma's own
  # config tooling) haven't picked up the patched releases yet. Both fixes
  # are within the current major, capped there for the same reason as above.
  proxy-addr: '>=2.0.8 <3.0.0'
  source-map-js: '>=1.2.2 <2.0.0'
  # prisma's own config loader (@prisma/config) pins effect 3.20.0, which has
  # a ReDoS in Schema.TemplateLiteral (GHSA-7589-6fvf-x4pw). Fixed in 3.22.1;
  # scoped to @prisma/config's own edge and capped at 3.x, as above.
  '@prisma/config>effect': '>=3.22.1 <4.0.0'
